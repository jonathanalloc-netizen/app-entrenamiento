name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Una app por perfil: jonathan en la raíz y cada perfil más en su subcarpeta.
      - name: Compilar perfiles
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          PROFILE=jonathan BASE_PATH=/$REPO/ npx vite build --outDir dist
          for p in $(ls src/profiles); do
            [ "$p" = jonathan ] && continue
            PROFILE=$p BASE_PATH=/$REPO/$p/ npx vite build --outDir dist/$p
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
